# Common controlled initialization and interaction budget for the Pt RL smokes.
runner:
  require_sft_initialization: true
algorithm:
  xvla_require_actor_update: true
env:
  train:
    total_num_envs: 8
    specific_reset_id: 0
  eval:
    specific_reset_id: 0
actor:
  global_batch_size: 80
  fsdp_config:
    disable: true
    xvla_ignore_frozen_parameters: true
  model:
    model_path: ${oc.env:XVLA_PT_MODEL_PATH}
    xvla:
      initial_sft_checkpoint: ${oc.env:XVLA_INITIAL_SFT_CHECKPOINT,null}
      checkpoint_transformer: true
      position_std: 0.04
      rotation_std: 0.12
      gripper_logit_std: 0.6
