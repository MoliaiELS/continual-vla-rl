# Final bounded qualification: two independent groups; no reward/task/horizon changes.
# Increased exploration is an explicitly distinct policy, not a performance comparison.
defaults:
  - _embodied_base
  - _ppo_overrides
  - _self_
hydra:
  searchpath:
    - file://${oc.env:RLINF_RUNTIME}/examples/embodiment/config
  run:
    dir: .
  output_subdir: null
runner:
  logger:
    experiment_name: grpo_stress-smoke
algorithm:
  adv_type: grpo
  loss_type: actor
  group_size: 4
  filter_rewards: true
  rewards_lower_bound: 0.01
  rewards_upper_bound: 0.99
  log_group_success_metrics: true
env:
  train:
    total_num_envs: 8
    group_size: 4
actor:
  global_batch_size: 80
  fsdp_config:
    xvla_ignore_frozen_parameters: true
  model:
    add_value_head: false
    xvla:
      checkpoint_transformer: true
      position_std: 0.04
      rotation_std: 0.12
      gripper_logit_std: 0.6
