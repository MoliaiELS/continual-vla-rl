defaults:
  - /libero_spatial_ppo_openpi_pi05
  - _self_
hydra:
  searchpath:
    - file://${oc.env:RLINF_RUNTIME}/examples/embodiment/config
  run:
    dir: .
  output_subdir: null
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all
runner:
  max_epochs: 1
  max_steps: 1
  only_eval: false
  val_check_interval: -1
  save_interval: 1
  resume_dir: null
  logger:
    log_path: ${oc.env:XVLA_RUN_DIR}
    project_name: fyp-xvla
    experiment_name: ppo-smoke
    logger_backends: [tensorboard]
algorithm:
  adv_type: gae
  loss_type: actor
  group_size: 1
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 1
  filter_rewards: false
  gamma: 0.7397003733882802 # 0.99 per physical step, 30 executed slots/chunk
  gae_lambda: 0.95
  entropy_bonus: 0.0
  normalize_advantages: true
env:
  train:
    total_num_envs: 2
    rollout_epoch: 1
    group_size: 1
    max_episode_steps: 300
    max_steps_per_rollout_epoch: 300
    specific_reset_id: 42
    num_steps_wait: 10
    reset_gripper_open: false
    auto_reset: false
    ignore_terminations: false
    xvla_absolute_control: true
    xvla_raw_observations: true
    xvla_measured_state: true
    xvla_history_reset: true
    xvla_strict_episodes: true
    video_cfg:
      save_video: true
      video_base_dir: ${oc.env:XVLA_RUN_DIR}/video/train
  eval:
    total_num_envs: 2
    rollout_epoch: 1
    group_size: 1
    max_episode_steps: 800
    max_steps_per_rollout_epoch: 810 # ceil(800/30)*30; strict mask excludes final ten slots
    specific_reset_id: 42
    num_steps_wait: 10
    reset_gripper_open: false
    auto_reset: false
    ignore_terminations: false
    xvla_absolute_control: true
    xvla_raw_observations: true
    xvla_measured_state: true
    xvla_history_reset: true
    xvla_strict_episodes: true
    video_cfg:
      save_video: true
      video_base_dir: ${oc.env:XVLA_RUN_DIR}/video/eval
actor:
  micro_batch_size: 1
  global_batch_size: 20
  model:
    model_type: xvla
    model_path: ${oc.env:XVLA_MODEL_PATH}
    precision: fp32
    is_lora: false # extension owns PEFT/prompt scope; no factory double injection
    num_action_chunks: 30
    action_dim: 7
    logprob_action_dim: 1 # every scalar factor already sums all ten raw coordinates
    add_value_head: true
    xvla:
      update_scope: prompt_heads
      domain_rows: [3]
      domain_id: 3
      steps: 10
      image_orientation: native_raw
      rotation_backend: robosuite
      eval_sampler: native_eval
      position_std: 0.003
      rotation_std: 0.01
      gripper_logit_std: 0.15
      audit_gradients: true
      logprob_tolerance: 0.001
  optim:
    lr: 1.0e-6
    value_lr: 1.0e-5
    weight_decay: 0.0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    gradient_checkpointing: false
    use_liger_kernel: false
    mixed_precision:
      param_dtype: fp32
      reduce_dtype: fp32
      buffer_dtype: fp32
    amp_autocast:
      enabled: false
rollout:
  enable_cuda_graph: false
  collect_prev_infos: true
  collect_final_values: true
  model:
    model_type: ${actor.model.model_type}
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}
    is_lora: false
    num_action_chunks: ${actor.model.num_action_chunks}
    action_dim: 7
    add_value_head: ${actor.model.add_value_head}
    pass_predict_mode: true
    xvla: ${actor.model.xvla}
