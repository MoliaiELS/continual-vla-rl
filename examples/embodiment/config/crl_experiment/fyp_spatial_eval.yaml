defaults:
  - libero_spatial_grpo_openvlaoft_eval_spatial
  - _self_

hydra:
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

runner:
  logger:
    logger_backends: [tensorboard]
algorithm:
  eval_rollout_epoch: 1
env:
  fixed_task_ids: [0]
  eval:
    num_envs: 2
    eval_per_task: 2
    video_cfg:
      save_video: true
actor:
  checkpoint_load_path: ${oc.env:FYP_MODEL_PATH}
  model:
    is_lora: false
  tokenizer:
    tokenizer_model: ${oc.env:FYP_MODEL_PATH}
rollout:
  model_dir: ${oc.env:FYP_MODEL_PATH}
